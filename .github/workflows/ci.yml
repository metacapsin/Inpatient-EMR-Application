name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (migrate + tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: emr_user
          POSTGRES_PASSWORD: emr_pass
          POSTGRES_DB: emr
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U emr_user -d emr"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://emr_user:emr_pass@localhost:5432/emr
      JWT_SECRET: ci-only-jwt-secret-not-for-production-0123456789
      JWT_REFRESH_SECRET: ci-only-refresh-secret-not-for-production-0123456789
      PLATFORM_JWT_SECRET: ci-only-platform-secret
      SMART_JWT_SECRET: ci-only-smart-secret
      CORS_ORIGINS: http://localhost:5173
      SEED_ADMIN_EMAIL: admin@example.com
      SEED_ADMIN_PASSWORD: CiOnlyPassw0rd!
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: node src/db/migrate.js
      - run: npm test

  frontend:
    name: Frontend (typecheck + unit + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit -p tsconfig.json
      - run: npx vitest run
      - run: npx vite build
        env:
          VITE_EMR_API_BASE_URL: http://localhost:4000

  secrets:
    name: Secret scan (changed commits)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Scan only the commits in this push/PR. The retired Gemini key in commit 07fb8ab is a known
          # historical finding; purging history is tracked separately in docs/healthcare-audit.
          GITLEAKS_ENABLE_SUMMARY: 'true'
